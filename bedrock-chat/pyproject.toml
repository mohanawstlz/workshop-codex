[project]
name = "bedrock-chat"
version = "0.1.0"
description = "React and FastAPI chat app for GPT models on Amazon Bedrock."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
test = ["httpx>=0.28.0", "pytest>=8.0.0"]

[tool.pytest.ini_options]
# Make the `bedrock_chat` package importable when running `pytest` from this folder.
pythonpath = ["."]
testpaths = ["tests"]
